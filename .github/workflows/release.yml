name: Release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Package the compiled SDK and publish a verified release
        run: |
          test "$GITHUB_REF_TYPE" = tag
          PARANOD_SDK_VERSION=$(node -p 'require("./package.json").version')
          test "$GITHUB_REF_NAME" = "v$PARANOD_SDK_VERSION"
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          npm pack
          sha256sum "paranod-plugin-sdk-$PARANOD_SDK_VERSION.tgz" > SHA256SUMS
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft > /tmp/paranod-sdk-release-state; then
            test "$(cat /tmp/paranod-sdk-release-state)" = true
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft               --title "Paranod Addon SDK $PARANOD_SDK_VERSION" --notes-file "docs/releases/$GITHUB_REF_NAME.md"
          fi
          gh release upload "$GITHUB_REF_NAME" "paranod-plugin-sdk-$PARANOD_SDK_VERSION.tgz" SHA256SUMS --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
